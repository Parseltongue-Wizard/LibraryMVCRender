$kind: http-request
name: 03 GET /api/books/1 - існуюче видання
url: "{{baseUrl}}/api/books/1"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Код 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Збігається зі списком', function () {
          const book = pm.response.json();
          pm.expect(book.id).to.eql(1);
          pm.expect(book.title).to.eql(pm.collectionVariables.get('sampleTitle'));
          pm.expect(String(book.publicationYear)).to.eql(pm.collectionVariables.get('sampleYear'));
          pm.expect(book.authors.length).to.be.at.least(1);
          pm.expect(book.features).to.be.an('array');
      });
    language: text/javascript
order: 3000
