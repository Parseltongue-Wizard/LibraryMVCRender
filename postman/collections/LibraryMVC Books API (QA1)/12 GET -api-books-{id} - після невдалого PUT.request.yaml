$kind: http-request
name: 12 GET /api/books/{id} - після невдалого PUT
url: "{{baseUrl}}/api/books/{{createdBookId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Код 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Лишилась попередня версія', function () {
          const book = pm.response.json();
          pm.expect(book.title).to.eql(pm.collectionVariables.get('qaTitle') + ' (оновлено)');
          pm.expect(book.publicationYear).to.eql(2025);
      });
    language: text/javascript
order: 12000
