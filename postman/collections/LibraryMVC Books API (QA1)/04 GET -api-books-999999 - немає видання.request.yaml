$kind: http-request
name: 04 GET /api/books/999999 - немає видання
url: "{{baseUrl}}/api/books/999999"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Код 404', function () {
          pm.response.to.have.status(404);
      });

      pm.test('Повідомлення українською', function () {
          const body = pm.response.json();
          pm.expect(body.message).to.include('не знайдено');
      });
    language: text/javascript
order: 4000
